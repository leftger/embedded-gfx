workspace = { members = ["load_stl", "asset_cli"] }
[package]
name = "embedded-3dgfx"
version = "0.4.1"
edition = "2024"
authors = ["Gerzain Mata <leftger@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/leftger/embedded-3dgfx"
readme = "./README.md"
description = "3D graphics rendering for embedded systems (fork of embedded-gfx by Kezii)"
keywords = [
    "embedded-graphics",
    "graphics",
    "embedded",
    "3d",
]
categories = [
    "embedded",
]

# This is a fork of embedded-gfx (https://github.com/Kezii/embedded-gfx)
# Original author: Kezii
# Fork adds: texture mapping, fog/dithering effects, DMA rendering, Z-buffer improvements

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["row_width_240", "std", "aa-heuristic", "aa-coverage"]
std = ["perfcounter"]
physics = []
dma2d = []
dsp = ["dep:embedded-dsp"]
depth-u16 = []
perfcounter = []
row_width_96 = []
row_width_160 = []
row_width_240 = []
row_width_320 = []
# AA infrastructure: ReadPixel trait + Wu's anti-aliased line algorithm.
# Enabled automatically by either of the triangle-AA features below.
aa = []
# Heuristic analytical edge-AA for triangles. Cheaper than aa-coverage
# (no extra buffer) but leaves a slight color-step seam at coplanar
# shared edges.
aa-heuristic = ["aa"]
# Per-pixel coverage tracking with end-of-frame bg composite. Costs an
# additional W*H byte buffer; eliminates the shared-edge seam.
aa-coverage = ["aa"]
# Disable default embedded cap profile selection in examples/apps.
desktop-unbounded = []
# Enable triple-buffered swapchain APIs.
triple-buffering = []
# Monotonic timing via embassy-time (no executor required).
embassy-time = ["dep:embassy-time"]
# Embassy-native DMA wake helpers (optional; core CompletionSlot works without this).
embassy = ["embassy-time", "dep:embassy-sync"]
# Use fixed-point screen-space projection path. Q16.16 arithmetic now
# lives in embedded-dsp's "fixed-point" feature (shared with embedded-gui),
# rather than a bespoke copy in this crate.
fixed-transform = ["dsp", "embedded-dsp/fixed-point"]
# Enable DWT cycle-counter profiling hooks.
dwt-profiler = []
# Enable RTT trace sink markers (board-specific integration required).
rtt-trace = []
# Enable ITM trace sink markers (board-specific integration required).
itm-trace = []

[dependencies]
embedded-graphics-core = "0.4.1"
embedded-graphics-framebuf = "0.3"
critical-section = "1.1"
log = "0.4"
micromath = { version = "2", default-features = false }
nalgebra = { version = "0.34", default-features = false, features = [ "libm" ] }
line_drawing = "1.0"
heapless = "0.9"
embassy-time = { version = "0.5", default-features = false, optional = true }
embassy-sync = { version = "0.8", default-features = false, optional = true }
embedded-dsp = { version = "0.2.0", optional = true }

[lib]
name = "embedded_3dgfx"
path = "src/lib.rs"
test = false

[dev-dependencies]
critical-section = { version = "1.1", features = ["std"] }
embassy-time = { version = "0.5", features = ["std"] }
embassy-sync = { version = "0.8" }
embedded-graphics-simulator = "0.8"
embedded-graphics = "0.8"
load_stl = { path = "load_stl" }
gif = "0.13"
sdl2 = { version = "0.38", features = ["use-pkgconfig"] }

[[example]]
name = "physics_bouncing_balls"
required-features = ["physics"]

[[example]]
name = "physics_demo"
required-features = ["physics"]

[[example]]
name = "physics_domino_chain"
required-features = ["physics"]

[[example]]
name = "physics_newtons_cradle"
required-features = ["physics"]

[[example]]
name = "physics_pendulum"
required-features = ["physics"]

[[example]]
name = "physics_rolling_ball"
required-features = ["physics"]

[[example]]
